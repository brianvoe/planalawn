<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Plan a Lawn</title>
  <!--
    The mark: a stand of turf growing out of soil, not a potted plant.

    Drawn to the same three rules as the `grass` icon in src/icons/lawn.ts,
    because they are the difference between turf and something else:

    - The blades stand along a baseline instead of converging on one point. A
      fan radiating from a single spot is an agave.
    - Their heights are uneven and the tallest is off centre. Even heights read
      as a comb.
    - Each one arches, and the bulge alternates side to side down the row.

    A lawn looks thick because it is dense, so this is a dozen thin blades
    rather than a few broad ones — widening the blades instead just grows a
    yucca. The paths are generated: see scripts/favicon-blades.mjs, which is
    where to change them, since twenty-point polygons cannot be edited by hand.

    Dark grass on a light field, over brown soil. Turf reads as healthy when it
    is the darkest green in the frame; lighten the blades and the lawn looks
    drought-struck however green it is.
  -->
  <defs>
    <clipPath id="rounded">
      <rect x="2" y="2" width="60" height="60" rx="14" ry="14" />
    </clipPath>
  </defs>

