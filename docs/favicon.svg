<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Lawn Plan Nerd</title>
  <defs>
    <clipPath id="rounded">
      <rect x="2" y="2" width="60" height="60" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="64" height="64" fill="#1a7a43" />

    <!-- Fairway -->
    <path
      d="M0 42
         C14 34, 24 46, 36 40
         C46 35, 54 44, 64 41
         L64 64
         L0 64
         Z"
      fill="#10321f"
    />

    <!-- Stem -->
    <rect x="29.5" y="28" width="5" height="22" rx="2.5" fill="#e8b877" />

    <!-- Leaves -->
    <ellipse cx="22" cy="30" rx="13" ry="8" fill="#e8b877" transform="rotate(-40 22 30)" />
    <ellipse cx="43" cy="26" rx="14" ry="8.5" fill="#f3d7a0" transform="rotate(38 43 26)" />
  </g>
</svg>
