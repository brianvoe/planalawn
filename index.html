<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defaults for the home page, and for anything served before the router has
      run. Every route rewrites these on navigation — see src/router/meta.ts,
      which is where the copy for each page lives.
    -->
    <meta
      name="description"
      content="Lawn timing from the live soil temperature at your address, product rates for your square footage, and grass seed scored on NTEP trial data."
    />
    <title>Plan a Lawn — know what to do next</title>
    <link rel="canonical" href="https://planalawn.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plan a Lawn" />
    <meta property="og:title" content="Plan a Lawn — know what to do next" />
    <meta
      property="og:description"
      content="Lawn timing from the live soil temperature at your address, product rates for your square footage, and grass seed scored on NTEP trial data."
    />
    <meta property="og:url" content="https://planalawn.com/" />
    <meta property="og:image" content="https://planalawn.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three tufts of grass growing on a mound of soil." />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      The two cuts that draw the first screen: body text and the headings above
      it. Started here so they are in flight before the stylesheet that asks for
      them has been parsed. The @font-face rules are generated into the bundle
      by scripts/fonts.mjs; these files are served unhashed so this stays true
      across builds. crossorigin is required on font preloads even same-origin,
      and without it the file is fetched a second time.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      crossorigin
    />

    <!-- analytics:start -->
    <!-- Google Analytics (GA4) — load early; page views are sent on each route
         change. Built output only: the dev server strips everything between the
         analytics markers, so localhost is never counted. -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-28VS9N8XDM', { send_page_view: false })
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-28VS9N8XDM"></script>
    <!-- analytics:end -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
